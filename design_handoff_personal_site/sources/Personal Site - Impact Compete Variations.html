<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Impact / Compete intro — variations</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Khand:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@400;500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet"/>

  <style>
    html, body { margin:0; padding:0; background:#f0eee9; height:100%; }
    body { font-family: 'Manrope', system-ui, sans-serif; }
    * { box-sizing: border-box; }
    #root { width:100vw; height:100vh; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="intro-variations.jsx"></script>

  <script type="text/babel">
    function App() {
      return (
        <DesignCanvas>
          <DCSection
            id="ic-intro"
            title="Impact / Compete — two test variations of just this intro section"
            subtitle="Lando 'On Track / Off Track' approach. Top-down CAD slides in from each side, handwritten labels, hand-drawn heart, short 1–2 sentence blurbs leading into the side-by-side detail panels below. Placeholder uses a wireframe drone (mirrored on the right) — swap for real top-down shots later."
          >
            <DCArtboard id="ic-a" label="A · Faithful Lando — wordmark side-by-side, heart over IMPACTFUL" width={1280} height={920}>
              <VariationA/>
            </DCArtboard>
            <DCArtboard id="ic-b" label="B · Stacked overlap — wordmark stacked vertically, heart between" width={1280} height={920}>
              <VariationB/>
            </DCArtboard>
            <DCArtboard id="ic-c" label="C · Like B, with ~1.5× more waves cascading all the way to telemetry-dark" width={1280} height={920}>
              <VariationC/>
            </DCArtboard>
            <DCArtboard id="ic-d" label="D · Like C, but waves only live in the bottom 40% of the viewport" width={1280} height={920}>
              <VariationD/>
            </DCArtboard>
            <DCArtboard id="ic-e" label="E · Different transition — halftone dot-matrix fading cream → telemetry" width={1280} height={920}>
              <VariationE/>
            </DCArtboard>
            <DCArtboard id="ic-f" label="F · Like E, but hexagons (varied opacity + size) starting 75% down" width={1280} height={920}>
              <VariationF/>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
